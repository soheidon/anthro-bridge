[package]
name = "anthro-bridge"
version = "0.23.0"
edition = "2021"

[lib]
name = "anthro_bridge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cap-std = "4.0.3"
cap-primitives = "4.0.3"
io-lifetimes = "3.0.1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
bytes = "1"
chrono = "0.4"
encoding_rs = "0.8"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "process", "time", "io-util"] }
tokio-util = "0.7"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.24.0", features = ["v4"] }
rand = "0.8"
subtle = "2"
anthro-bridge-mcp-server = { path = "../../mcp-server" }
rmcp = { version = "3", features = ["client", "transport-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell"
] }
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

[profile.release]
# Reduce compiler stack pressure for the monolithic lib.rs (5 000+ lines).
# opt-level=2 + more codegen units prevent STATUS_STACK_BUFFER_OVERRUN /
# STATUS_ACCESS_VIOLATION crashes during release compilation.
opt-level = 2
codegen-units = 16
lto = false

[dev-dependencies]
tempfile = "3"
