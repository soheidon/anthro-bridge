[package]
name = "anthro-bridge-mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP server that generates implementation plans via DeepSeek V4 Pro"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3", features = ["client"] }
wiremock = "0.6"
